name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tennis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_DEBUG: "False"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      SQL_DATABASE: "tennis"
      SQL_USER: "root"
      SQL_PASSWORD: "root"
      SQL_HOST: "127.0.0.1"
      SQL_PORT: "3306"
      EMAIL_USE_TLS: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff (syntax & undefined names check)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --select E9,F63,F7,F82"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run test suite
        run: python manage.py test ladder

<!-- Head-to-Head Lightbox Modal -->
<div class="modal fade" id="h2hLightboxModal" tabindex="-1" aria-labelledby="h2hLightboxModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content shadow">
            <div class="modal-header py-2 py-sm-3">
                <h5 class="modal-title fw-bold" id="h2hLightboxModalLabel">Head-to-Head</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-2 p-sm-3" id="h2hLightboxModalBody">
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
                    Loading match history...
                </div>
            </div>
            <div class="modal-footer py-2 d-flex justify-content-between align-items-center">
                <a href="#" id="h2hLightboxFullPageLink" class="small text-muted text-decoration-none">Open full page</a>
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    (function () {
        var modalEl = document.getElementById('h2hLightboxModal');
        if (!modalEl) return;

        var modalInstance = null;
        var modalBody = document.getElementById('h2hLightboxModalBody');
        var modalTitle = document.getElementById('h2hLightboxModalLabel');
        var fullPageLink = document.getElementById('h2hLightboxFullPageLink');

        function getModal() {
            if (!modalInstance && window.bootstrap && window.bootstrap.Modal) {
                modalInstance = new window.bootstrap.Modal(modalEl);
            }
            return modalInstance;
        }

        window.openH2HModal = function (url, title) {
            if (!url) return;
            var modal = getModal();
            if (!modal) {
                window.location = url;
                return;
            }

            modalTitle.textContent = title || 'Head-to-Head Details';
            if (fullPageLink) {
                fullPageLink.setAttribute('href', url);
            }
            modalBody.innerHTML = (
                '<div class="text-center py-5 text-muted">' +
                '<div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>' +
                'Loading match history...' +
                '</div>'
            );
            modal.show();

            var fetchUrl = url + (url.indexOf('?') === -1 ? '?modal=1' : '&modal=1');
            fetch(fetchUrl, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                credentials: 'same-origin'
            })
                .then(function (resp) {
                    if (!resp.ok) throw new Error('Failed to load head-to-head');
                    return resp.text();
                })
                .then(function (html) {
                    modalBody.innerHTML = html;
                })
                .catch(function () {
                    modalBody.innerHTML = (
                        '<div class="alert alert-warning mb-0">' +
                        'Could not load head-to-head details. <a href="' + url + '" class="alert-link">Open full page</a>.' +
                        '</div>'
                    );
                });
        };

        document.addEventListener('click', function (e) {
            if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
                return;
            }
            var trigger = e.target.closest('[data-h2h-url]');
            if (!trigger) return;

            // If user clicked a normal link inside a row trigger (e.g. player profile link) that is not itself the H2H trigger, let it navigate
            var clickedLink = e.target.closest('a');
            if (clickedLink && clickedLink !== trigger && !clickedLink.hasAttribute('data-h2h-url')) {
                return;
            }

            e.preventDefault();
            var url = trigger.getAttribute('data-h2h-url');
            var title = trigger.getAttribute('data-h2h-title') || 'Head-to-Head Details';
            window.openH2HModal(url, title);
        });
    })();
</script>

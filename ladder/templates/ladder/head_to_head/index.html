{% extends 'base.html' %}
{% block container %}
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="mb-0">{{ player_name }} vs {{ opponent_name }}</h2>
        <div class="d-flex gap-2">
            <a href="{% url 'player_history' player.id %}" class="btn btn-sm btn-outline-secondary">
                {{ player_name }} Profile
            </a>
            <a href="{% url 'player_history' opponent.id %}" class="btn btn-sm btn-outline-secondary">
                {{ opponent_name }} Profile
            </a>
        </div>
    </div>

    {% include 'ladder/head_to_head/_modal_content.html' %}
{% endblock %}

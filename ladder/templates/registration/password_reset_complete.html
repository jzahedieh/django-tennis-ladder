{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block container %}
<div class="row justify-content-center my-4 my-md-5">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5" style="max-width: 440px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-light py-3 px-4 border-bottom">
                <h4 class="mb-0 fw-bold text-success">Password Updated</h4>
            </div>
            <div class="card-body p-4">
                <p class="mb-3">Your new password has been set. You can now log in to your account and enter results.</p>
                <div class="d-grid">
                    <a href="{% url 'login' %}" class="btn btn-primary">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
